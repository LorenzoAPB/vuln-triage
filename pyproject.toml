[project]
name = "vuln-triage"
version = "0.1.0"
description = "LLM-drafted, human-approved triage of security vulnerability reports."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lorenzo Bardi" }]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.49,<4",
    "pydantic>=2.14,<3",
    "cvss>=3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[project.scripts]
vuln-triage = "vuln_triage.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vuln_triage"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E741"]  # CVSS metric names like I and A are the domain vocabulary

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
